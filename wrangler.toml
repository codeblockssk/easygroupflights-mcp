name = "easygroupflights-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-19"
workers_dev = true

# Public, non-secret configuration. Secrets are set with wrangler secret put:
#   AUTOPILOT_URL, AUTOPILOT_API_KEY, PELIKAN_MCP_URL
#   CONFIRM_SECRET   signs the confirmation tokens of two-step writes
#   GATEWAY_TOKEN    the Tripdesk gateway's service token (marks its calls)
# The intake URL is a secret rather than a var only because this repo is public;
# it is infrastructure, not a credential.
[vars]
SITE_URL = "https://easygroupflights.com"
GROUP_MIN_PASSENGERS = "10"
# Currency the fare service quotes in; follows whichever server PELIKAN_MCP_URL points at.
FARE_CURRENCY = "EUR"
# Public, read-only Ghost Content API keys (printed in each blog page), for serving the studies as resources.
GHOST_CONTENT_KEY_EN = "54c96f6544712cd43f04021bd8"
GHOST_CONTENT_KEY_PL = "dd998ceed48d2e29d0cb19fb70"

[[routes]]
pattern = "mcp.easygroupflights.com"
custom_domain = true

# Per address for direct callers; one shared budget for the gateway, which
# stands for many travellers. Periods can only be 10 or 60 seconds.
[[ratelimits]]
name = "DIRECT_LIMIT"
namespace_id = "1101"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "GATEWAY_LIMIT"
namespace_id = "1102"
simple = { limit = 1200, period = 60 }
